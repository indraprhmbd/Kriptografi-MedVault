name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Verify Code Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Unit and Integration Tests
        run: go test -v -race=false ./...

      - name: Compile Application Binaries
        run: |
          go build -o /dev/null ./cmd/app
          go build -o /dev/null ./cmd/validator
          go build -o /dev/null ./cmd/medkeygen
          go build -o /dev/null ./cmd/validator-keygen
