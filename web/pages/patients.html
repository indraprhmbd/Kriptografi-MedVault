<section class="mv-stack">
  <div class="mv-page-head mv-enter mv-enter-3">
    <div>
      <h2 class="mv-ui-title">Pasien</h2>
    </div>
    <div class="mv-page-actions">
      <span class="mv-badge mv-badge-teal">AES-256-GCM</span>
      <button type="button" class="mv-btn mv-btn-primary" @click="focusPatientMrn()">Pasien baru</button>
    </div>
  </div>

  <div class="mv-grid-2 mv-enter mv-enter-4" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);">
    <div class="mv-card">
      <div class="mv-card-head">
        <div>
          <h3 class="mv-card-title">Tambah pasien</h3>
        </div>
      </div>

      <form @submit.prevent="createPatient()" novalidate style="display:flex; flex-direction:column; gap:12px;">
        <div class="mv-field">
          <label for="patient-mrn">Nomor rekam medis</label>
          <div class="mt-1 flex gap-2">
            <input id="patient-mrn" x-model="patientForm.medical_record_number" @blur="patientTouched.medical_record_number = true" class="mv-input min-w-0 flex-1" placeholder="RM-YYYYMMDD-XXXX" required>
            <button type="button" class="mv-btn mv-btn-ghost mv-btn-sm shrink-0" @click="generateMRN()">Buat otomatis</button>
          </div>
        </div>
        <p class="mv-field-error" x-show="patientTouched.medical_record_number && !patientForm.medical_record_number.trim()" x-text="'Nomor rekam medis wajib diisi'" style="display:none;"></p>

        <label class="mv-field">NIK 16 digit
          <input x-model="patientForm.nik" @blur="patientTouched.nik = true" maxlength="16" inputmode="numeric" pattern="[0-9]{16}" class="mv-input mv-mono" placeholder="3171010101900001" required>
        </label>
        <p class="mv-field-error" x-show="patientTouched.nik && !patientForm.nik.trim()" x-text="'NIK wajib diisi'" style="display:none;"></p>
        <p class="mv-field-error" x-show="patientTouched.nik && patientForm.nik.trim() && !patientNikValid" x-text="'NIK harus tepat 16 digit angka tanpa spasi atau tanda baca'" style="display:none;"></p>


        <label class="mv-field">Nama lengkap
          <input x-model="patientForm.full_name" @blur="patientTouched.full_name = true" class="mv-input" placeholder="Nama sesuai KTP" required>
        </label>
        <p class="mv-field-error" x-show="patientTouched.full_name && !patientForm.full_name.trim()" x-text="'Nama lengkap wajib diisi'" style="display:none;"></p>

        <label class="mv-field">Alamat <span class="mv-field-note">(opsional)</span>
          <input x-model="patientForm.address" class="mv-input" placeholder="Jalan, nomor, kota">
        </label>

        <label class="mv-field">Tanggal lahir
          <input type="date" x-model="patientForm.birth_date" @blur="patientTouched.birth_date = true" class="mv-input" required>
        </label>
        <p class="mv-field-error" x-show="patientTouched.birth_date && !patientForm.birth_date.trim()" x-text="'Tanggal lahir wajib diisi'" style="display:none;"></p>
        <p class="mv-field-error" x-show="patientTouched.birth_date && patientForm.birth_date.trim() && !patientBirthDateValid" x-text="'Tanggal lahir harus berformat YYYY-MM-DD'" style="display:none;"></p>

        <p class="mv-note">Data identitas disimpan dengan enkripsi AES-256-GCM.</p>
        <button type="submit" class="mv-btn mv-btn-primary" style="width:100%; margin-top:14px;" :disabled="busy">Daftarkan pasien</button>
      </form>
    </div>

    <div class="mv-card">
      <div class="mv-card-head">
        <div>
          <h3 class="mv-card-title">Daftar pasien</h3>
          <p class="mv-card-sub" x-text="patients.length + ' pasien'"></p>
        </div>
        <div class="mv-segmented" role="group" aria-label="Tampilan data">
          <button type="button" class="mv-segment" :class="patientView === 'decrypted' ? 'is-active' : ''" :disabled="busy" @click="setPatientView('decrypted')">Data asli</button>
          <button type="button" class="mv-segment" :class="patientView === 'raw' ? 'is-active' : ''" :disabled="busy" @click="setPatientView('raw')">Data terenkripsi</button>
        </div>
      </div>

      <div class="mv-table-wrap">
        <table class="mv-table">
          <thead>
            <tr>
              <th>No. RM</th>
              <th x-text="patientView === 'raw' ? 'NIK terenkripsi' : 'NIK'"></th>
              <th x-text="patientView === 'raw' ? 'Nama terenkripsi' : 'Nama'"></th>
              <th x-text="patientView === 'raw' ? 'Alamat terenkripsi' : 'Alamat'"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="p in patients" :key="p.id">
              <tr>
                <td><span class="mv-badge mv-badge-teal mv-mono" x-text="p.medical_record_number"></span></td>
                <template x-if="patientView === 'raw'">
                  <td><div class="mv-mono mv-scroll-text mv-scroll-text-compact mv-table-text" x-text="p.columns && p.columns.nik_enc"></div></td>
                </template>
                <template x-if="patientView === 'raw'">
                  <td><div class="mv-mono mv-scroll-text mv-scroll-text-compact mv-table-text" x-text="p.columns && p.columns.full_name_enc"></div></td>
                </template>
                <template x-if="patientView === 'raw'">
                  <td><div class="mv-mono mv-scroll-text mv-scroll-text-compact mv-table-text" x-text="p.columns && p.columns.address_enc"></div></td>
                </template>
                <template x-if="patientView !== 'raw'">
                  <td><div class="mv-mono mv-scroll-text mv-scroll-text-compact mv-table-text" x-text="p.nik"></div></td>
                </template>
                <template x-if="patientView !== 'raw'">
                  <td><div class="mv-scroll-text mv-scroll-text-compact mv-table-text" x-text="p.full_name"></div></td>
                </template>
                <template x-if="patientView !== 'raw'">
                  <td><div class="mv-row-sub mv-scroll-text mv-scroll-text-compact mv-table-text" x-text="p.address"></div></td>
                </template>
              </tr>
            </template>
            <tr x-show="patients.length === 0"><td colspan="4" style="text-align:center; color:var(--mv-ui-ink-muted);">Belum ada data pasien</td></tr>
          </tbody>
        </table>
      </div>

      <div x-show="patientView === 'raw'" style="margin-top:16px; padding:16px; border-radius:16px; background:var(--mv-ui-dark-card); color:var(--mv-ui-accent-mint);">
        <p style="margin:0 0 10px; font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--mv-ui-accent-bright);">Data yang tersimpan</p>
        <dl class="mv-kv" style="color:var(--mv-ui-accent-mint);">
          <dt style="color:var(--mv-ui-ink-soft);">NIK terenkripsi</dt>
          <dd class="mv-mono mv-scroll-text mv-scroll-text-compact" x-text="(patients[0] && patients[0].columns && patients[0].columns.nik_enc) || '-'"></dd>
          <dt style="color:var(--mv-ui-ink-soft);">Nama terenkripsi</dt>
          <dd class="mv-mono mv-scroll-text mv-scroll-text-compact" x-text="(patients[0] && patients[0].columns && patients[0].columns.full_name_enc) || '-'"></dd>
          <dt style="color:var(--mv-ui-ink-soft);">Alamat terenkripsi</dt>
          <dd class="mv-mono mv-scroll-text mv-scroll-text-compact" x-text="(patients[0] && patients[0].columns && patients[0].columns.address_enc) || '-'"></dd>
          <dt style="color:var(--mv-ui-ink-soft);">Konteks enkripsi</dt>
          <dd class="mv-mono">"patients.nik" · "patients.full_name" · "patients.address"</dd>
        </dl>
      </div>
    </div>
  </div>
</section>
