<section class="space-y-4">
  <div>
    <h2 class="text-2xl font-bold">Keamanan dan Sesi</h2>
    <p class="text-sm">Status autentikasi, kondisi layanan, serta seluruh gerbang keamanan perangkat.</p>
  </div>

  <div class="grid gap-4 md:grid-cols-2">
    <div class="rounded-2xl border bg-white p-5">
      <h3 class="font-semibold">Status autentikasi</h3>
      <p class="mt-2 text-sm" x-text="session ? 'Sesi aktif: ' + session.username : 'Belum masuk'"></p>
      <p class="mt-2 text-xs text-slate-500">Autentikasi akun, dongle Ed25519, biometrik dHash, dan opsi WebAuthn.</p>
      <p class="mt-2 text-xs text-slate-500" x-text="dongle ? 'Dongle dimuat: ' + dongle.keyId : 'Dongle belum dimuat pada tab ini'"></p>
    </div>
    <div class="rounded-2xl border bg-white p-5">
      <h3 class="font-semibold">Kondisi layanan</h3>
      <p class="mt-2 text-sm" x-text="health ? JSON.stringify(health, null, 2) : 'Informasi health belum tersedia'"></p>
    </div>
  </div>

  <div class="flex flex-wrap gap-2">
    <button type="button" x-show="!session" @click="navigate('/login')" class="rounded-lg bg-vault-400 px-4 py-2 text-sm font-semibold">Buka autentikasi</button>
    <button type="button" x-show="session" @click="logout()" class="rounded-lg border border-rose-300 px-4 py-2 text-sm font-semibold text-rose-700">Keluar dari sesi</button>
  </div>
</section>
