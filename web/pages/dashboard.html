<section class="mv-stack" x-data="{ moduleFilter: 'semua' }">
  <div class="mv-page-head mv-enter mv-enter-3">
    <div>
      <h2 class="mv-ui-title">Ringkasan</h2>
    </div>
    <div class="mv-page-actions">
      <span class="mv-badge" :class="healthBadgeClass" x-text="healthLabel"></span>
      <button type="button" class="mv-btn mv-btn-primary" @click="navigate('/patients')">Tambah pasien</button>
    </div>
  </div>

  <div class="mv-grid-4 mv-enter mv-enter-4">
    <div class="mv-stat">
      <p class="mv-stat-label">Pasien</p>
      <p class="mv-stat-value" x-text="patients.length"></p>
    </div>
    <div class="mv-stat">
      <p class="mv-stat-label">Blok audit</p>
      <p class="mv-stat-value" x-text="blocks.length"></p>
    </div>
    <div class="mv-stat">
      <p class="mv-stat-label">Integritas audit</p>
      <p class="mv-stat-value" :style="validation ? (validation.valid ? 'color:var(--mv-ui-success-ink);' : 'color:var(--mv-ui-danger-ink);') : 'color:var(--mv-ui-ink-muted);'" x-text="validation ? (validation.valid ? 'Terverifikasi' : 'Tidak valid') : 'Belum diperiksa'"></p>
    </div>
    <div class="mv-stat">
      <p class="mv-stat-label">Akun dokter</p>
      <p class="mv-stat-value" style="font-size:var(--mv-ui-text-24);" x-text="!sessionReady || !session || !session.username ? '-' : session.username"></p>
    </div>
  </div>

  <div class="mv-split mv-enter mv-enter-5">
    <div class="mv-card">
      <div class="mv-card-head">
        <div>
          <h3 class="mv-card-title">Modul</h3>
        </div>
        <div class="mv-segmented" role="group" aria-label="Filter modul">
          <button type="button" class="mv-segment" :class="moduleFilter === 'semua' ? 'is-active' : ''" @click="moduleFilter = 'semua'">Semua</button>
          <button type="button" class="mv-segment" :class="moduleFilter === 'kripto' ? 'is-active' : ''" @click="moduleFilter = 'kripto'">Keamanan data</button>
          <button type="button" class="mv-segment" :class="moduleFilter === 'audit' ? 'is-active' : ''" @click="moduleFilter = 'audit'">Audit</button>
        </div>
      </div>

      <template x-for="m in [
        { label: 'Pasien', path: '/patients', cat: 'data' },
        { label: 'Rekam medis', path: '/records', cat: 'kripto' },
        { label: 'Berkas laboratorium', path: '/vault', cat: 'kripto' },
        { label: 'Watermark PNG', path: '/steganography', cat: 'kripto' },
        { label: 'Riwayat audit', path: '/audit', cat: 'audit' }
      ]" :key="m.path">
        <div class="mv-list-row" x-show="moduleFilter === 'semua' || moduleFilter === m.cat">
          <div class="mv-row-main">
            <p class="mv-row-title" x-text="m.label"></p>
          </div>
          <button type="button" class="mv-btn mv-btn-ghost mv-btn-sm" @click="navigate(m.path)">Buka</button>
        </div>
      </template>
    </div>

    <div class="mv-ledger mv-ui-gradient-panel mv-enter mv-enter-6">
      <div class="mv-card-head">
        <div>
          <div class="mv-algorithm-help-wrap"><h3 class="mv-ledger-title">Rantai audit</h3><button type="button" class="mv-help-trigger" aria-label="Penjelasan PoA" aria-controls="mv-algorithm-help-popover" :aria-expanded="algorithmHelp.open && algorithmHelp.key === 'poa'" @click="openAlgorithmHelp('poa', $event)">?</button></div>
        </div>
        <button type="button" class="mv-btn mv-btn-mint mv-btn-sm" @click="loadAudit()">Periksa rantai</button>
      </div>

      <div>
        <template x-for="b in blocks.slice(-3).reverse()" :key="b.current_hash">
          <div class="mv-block-row">
            <div>
              <span class="mv-badge mv-badge-teal mv-mono" x-text="formatBlockRef(b)"></span>
            </div>
            <span class="mv-badge" :class="!validation ? 'mv-badge-teal' : (b.block_index === validation.first_failure?.block_index ? 'mv-badge-danger' : 'mv-badge-success')" x-text="!validation ? 'Belum diperiksa' : (b.block_index === validation.first_failure?.block_index ? 'Tidak valid' : 'Terverifikasi')"></span>
          </div>
        </template>
        <template x-if="blocks.length === 0">
          <p class="mv-note" style="margin:0;">Belum ada blok audit.</p>
        </template>
      </div>
    </div>
  </div>
</section>
