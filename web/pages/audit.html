<section class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold">Audit Ledger PoA</h2>
    <p class="text-sm">Telusuri blok audit, verifikasi tanda tangan dongle, dan simulasikan manipulasi data.</p>
  </div>

  <div class="rounded-xl border border-vault-800 bg-vault-900/60 p-5 space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <div>
        <h2 class="text-base font-semibold text-white">Rantai Audit PoA</h2>
        <p class="text-xs text-slate-400">Setiap blok memuat tanda tangan dongle dokter dan countersignature validator gateway.</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="rounded-md border border-vault-700 px-3 py-2 text-xs text-slate-200 hover:border-vault-400"
                :disabled="busy" @click="loadAudit()">Verifikasi ulang</button>
        <button type="button" class="rounded-md border border-rose-500/50 px-3 py-2 text-xs text-rose-200 hover:border-rose-400"
                :disabled="busy" @click="simulateTamper()">Rusak ciphertext</button>
        <button type="button" class="rounded-md border border-emerald-500/50 px-3 py-2 text-xs text-emerald-200 hover:border-emerald-400"
                :disabled="busy" @click="restoreTamper()">Pulihkan ciphertext</button>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 text-xs">
      <label class="text-slate-400">ID rekam medis untuk simulasi
        <input x-model.number="tamperRecordId" type="number" min="1" class="ml-2 w-24 rounded-md border border-vault-700 bg-vault-950 px-2 py-1">
      </label>
      <span class="rounded-full border px-3 py-1"
            :class="validation?.valid ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-300' : 'border-rose-500/40 bg-rose-500/10 text-rose-300'"
            x-text="validation ? (validation.valid ? 'Rantai valid' : 'Rantai tidak valid: ' + (validation.first_failure?.reason || '')) : 'Belum diperiksa'"></span>
      <span class="text-slate-500" x-text="validation ? validation.blocks_checked + ' blok diperiksa' : ''"></span>
    </div>

    <div class="overflow-auto rounded-lg border border-vault-800">
      <table class="min-w-full text-xs">
        <thead class="bg-vault-950 text-slate-400">
          <tr>
            <th class="px-3 py-2 text-left">Index</th>
            <th class="px-3 py-2 text-left">Aksi</th>
            <th class="px-3 py-2 text-left">Aktor</th>
            <th class="px-3 py-2 text-left">Record</th>
            <th class="px-3 py-2 text-left">Current hash</th>
            <th class="px-3 py-2 text-left">Validator</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-vault-800">
          <template x-for="b in blocks" :key="b.current_hash">
            <tr class="hover:bg-vault-800/40">
              <td class="px-3 py-2 font-mono" x-text="b.block_index"></td>
              <td class="px-3 py-2" x-text="b.action_type"></td>
              <td class="px-3 py-2" x-text="b.actor_username"></td>
              <td class="px-3 py-2 font-mono" x-text="b.target_record_id ?? '-'"></td>
              <td class="px-3 py-2 font-mono text-[10px] text-vault-200" x-text="b.current_hash?.slice(0, 24) + '...'"></td>
              <td class="px-3 py-2 font-mono text-[10px]" x-text="b.validator_signature_hex ? 'Ed25519 ok' : 'belum'"></td>
            </tr>
          </template>
          <tr x-show="blocks.length === 0"><td colspan="6" class="px-3 py-4 text-center text-slate-500">Ledger masih kosong</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
